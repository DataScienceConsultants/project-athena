[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "project-athena"
version = "0.4.1"
description = "Experimental seismic intelligence and observatory platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "scikit-learn>=1.5,<2",
]

parquet = [
    "pyarrow>=17,<20",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "data",
    "notebooks",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]
