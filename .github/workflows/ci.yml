name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Athena and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parquet]"

      - name: Lint
        run: python -m ruff check .

      - name: Test with coverage
        run: python -m pytest -q --cov=src --cov-report=term-missing

      - name: Compile source
        run: python -m compileall src

      - name: Check whitespace
        run: git diff --check
